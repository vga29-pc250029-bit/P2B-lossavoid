<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><script src="https://cdn.tailwindcss.com"></script><title>提供済み料理一覧</title><link href="/css/kitchen.css" rel="stylesheet"/><link href="/css/v2-pages.css" rel="stylesheet"/></head><body class="h-screen flex flex-col overflow-hidden" data-page="kitchen"><header class="header-bg p-1 flex justify-between items-center border-b border-black">
<div class="flex space-x-2">
<button class="btn-yellow px-4 py-1 font-bold" id="news-btn">速報</button>
<button class="btn-yellow px-4 py-1 font-bold" id="completed-btn">提供済</button>
<button class="btn-yellow px-4 py-1 font-bold" id="shift-btn">シフト確認</button>
</div>
<div class="flex items-center space-x-4">
<button class="btn-yellow px-6 py-1 font-bold" id="delete-btn">全消去</button>
<button class="btn-yellow px-6 py-1 font-bold" id="organize-btn">整理</button>
<span class="text-2xl font-mono" id="current-time">hh:mm:ss</span>
</div>
</header><nav class="v2-links"><a href="/kitchen">KDS</a><a href="/kitchen/served">提供済み</a><a href="/kitchen/tables">卓状況</a><a href="/kitchen/simulator">シミュレーター</a></nav><div class="flex-1 flex overflow-hidden">
<div class="w-1/2 p-1 overflow-y-auto border-r border-black">
<div id="orderContainer"></div>
</div>
<div class="flex-1 right-panel p-1 overflow-y-auto">
<div id="organizedOrders"></div>
</div>
</div><div class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" id="served-modal">
<div class="bg-white w-full max-w-6xl max-h-[90vh] flex flex-col border-2 border-black">
<div class="header-bg flex justify-between items-center p-3 border-b border-black">
<h2 class="text-2xl font-bold">✅ 提供済み料理一覧</h2>
<button class="btn-yellow px-4 py-1 font-bold text-xl" id="served-modal-close">閉じる ✕</button>
</div>
<div class="flex flex-wrap items-center gap-4 p-3 border-b border-gray-300 bg-gray-50">
<label class="flex items-center gap-2 text-lg font-bold">
                    卓番フィルター:
                    <select class="border border-gray-400 px-2 py-1 text-lg" id="served-filter-table">
<option value="">すべての卓番</option>
</select>
</label>
<label class="flex items-center gap-2 text-lg font-bold">
                    料理フィルター:
                    <select class="border border-gray-400 px-2 py-1 text-lg" id="served-filter-dish">
<option value="">すべての料理</option>
</select>
</label>
<span class="ml-auto text-lg text-gray-600" id="served-count">0 件</span>
</div>
<div class="overflow-auto flex-1 p-2">
<table class="w-full text-base border-collapse">
<thead>
<tr class="bg-yellow-100">
<th class="border border-gray-300 px-2 py-2">卓番</th>
<th class="border border-gray-300 px-2 py-2">注文時間</th>
<th class="border border-gray-300 px-2 py-2">注文商品</th>
<th class="border border-gray-300 px-2 py-2">注文個数</th>
<th class="border border-gray-300 px-2 py-2">注文金額</th>
<th class="border border-gray-300 px-2 py-2">提供時間</th>
<th class="border border-gray-300 px-2 py-2">遅速(±)</th>
<th class="border border-gray-300 px-2 py-2">注文方法</th>
<th class="border border-gray-300 px-2 py-2">備考</th>
</tr>
</thead>
<tbody id="served-table-body">
</tbody>
</table>
</div>
</div>
</div><script src="/oracle-spring-api-client.js"></script><script src="/js/kitchen-clock.js"></script><script src="/kitchen-scheduler.js"></script><script src="/js/kitchen.js" type="module"></script></body></html>
