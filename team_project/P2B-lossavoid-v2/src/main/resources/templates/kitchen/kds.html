<!DOCTYPE html>
<!-- KDS本体。新しい注文、整理した調理予定、キッチン完成とフロア持出しの操作を表示する。 -->

<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="/" name="app-root" th:content="@{/}"/>
    <script src="/js/app-path.js" th:src="@{/js/app-path.js}"></script>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>キッチンディスプレイ</title>
    <link href="/css/kitchen.css" rel="stylesheet" th:href="@{/css/kitchen.css}"/>
</head>
<body class="kds-page" data-page="kitchen">
<header class="header-bg kds-header">
    <div class="header-actions">
        <!-- 元画面の未実装ボタンは、処理があるように見せず無効状態で残す。 -->
        <button class="btn-yellow" id="news-btn" type="button" disabled title="速報機能は未実装です">速報</button>
        <button class="btn-yellow" id="completed-btn" type="button">提供済</button>
        <button class="btn-yellow" id="shift-btn" type="button" disabled title="シフト確認機能は未実装です">シフト確認</button>
    </div>
    <div class="header-status">
        <div class="pickup-alert hidden" id="pickup-alert" aria-live="assertive"></div>
        <div class="kds-message hidden" id="kds-message" aria-live="polite"></div>
    </div>
    <div class="header-actions right">
        <button class="btn-yellow" id="delete-btn" type="button" title="整理結果だけを消去します。注文データは削除しません">全消去</button>
        <button class="btn-yellow primary" id="organize-btn" type="button">整理</button>
        <span class="current-time" id="current-time">hh:mm:ss</span>
    </div>
</header>
<main class="kds-workspace">
    <section class="raw-panel" aria-label="受信伝票">
        <div id="orderContainer"></div>
    </section>
    <section class="right-panel" aria-label="整理後の調理順と持出し待ち">
        <div id="organizedOrders"></div>
    </section>
</main>

<div class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-2" id="served-modal">
    <div class="served-dialog">
        <div class="header-bg served-dialog-header border-b border-black">
            <h2>✅ 提供済み料理一覧</h2>
            <button class="btn-yellow" id="served-modal-close">閉じる ✕</button>
        </div>
        <div class="served-filters">
            <label>卓番フィルター:
                <select id="served-filter-table"><option value="">すべての卓番</option></select>
            </label>
            <label>料理フィルター:
                <select id="served-filter-dish"><option value="">すべての料理</option></select>
            </label>
            <span id="served-count">0 件</span>
        </div>
        <div class="served-table-wrap">
            <table class="served-table">
                <thead>
                <tr>
                    <th>卓番</th>
                    <th>注文</th>
                    <th>料理</th>
                    <th>個数</th>
                    <th>金額</th>
                    <th>キッチン完成</th>
                    <th>注文→キッチン<br><small>実績 / 標準調理差</small></th>
                    <th>フロア持出し</th>
                    <th>キッチン→フロア<br><small>実績 / 30秒差</small></th>
                    <th>注文方法</th>
                    <th>備考</th>
                </tr>
                </thead>
                <tbody id="served-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- API共通処理を先に読み込み、その後に画面ごとの操作を初期化する。 -->
<script src="/oracle-spring-api-client.js" th:src="@{/oracle-spring-api-client.js}"></script>
<script src="/js/kitchen-clock.js" th:src="@{/js/kitchen-clock.js}"></script>
<script src="/kitchen-scheduler.js" th:src="@{/kitchen-scheduler.js}"></script>
<script src="/js/kitchen.js" th:src="@{/js/kitchen.js}" type="module"></script>
</body>
</html>
