<!DOCTYPE html>
<!-- サーバーが注文IDに対応する情報をモデルへ渡し、明細を表として描画する画面。 -->


<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta content="/" name="app-root" th:content="@{/}"/><script src="/js/app-path.js" th:src="@{/js/app-path.js}"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>注文詳細</title>
<link href="/css/v2-pages.css" rel="stylesheet" th:href="@{/css/v2-pages.css}"/>
</head>
<body class="v2-document">
<header><h1>注文詳細</h1></header>
<nav class="v2-links"><a href="/kitchen" th:href="@{/kitchen}">KDS</a><a href="/kitchen/tables" th:href="@{/kitchen/tables}">卓状況</a></nav>
<main>
<dl>
<dt>伝票番号</dt><dd th:text="${order.id}"></dd>
<dt>卓番</dt><dd th:text="${order.table}"></dd>
<dt>人数</dt><dd th:text="${order.guestCount ?: '-'}"></dd>
<dt>注文日時</dt><dd th:text="${order.createdAt}"></dd>
<dt>注文方法</dt><dd th:text="${order.orderMethod}"></dd>
</dl>
<div class="v2-table-wrap">
<table>
<thead><tr><th>商品</th><th>単価</th><th>個数</th><th>調理状態</th><th>提供状態</th></tr></thead>
<tbody>
<tr th:each="item : ${order.items}">
<td th:text="${item.name}"></td><td th:text="${item.price}"></td>
<td th:text="${item.qty}"></td><td th:text="${item.cookStatus}"></td>
<td th:text="${item.served ? '提供済み' : '未提供'}"></td>
</tr>
</tbody>
</table>
</div>
</main>
</body>
</html>
