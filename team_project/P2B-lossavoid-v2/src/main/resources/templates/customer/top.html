<!DOCTYPE html>
<!-- 管理画面の入口。ログイン中の権限に応じて注文操作と担当者管理への導線を表示する。 -->


<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta content="/" name="app-root" th:content="@{/}"/><script src="/js/app-path.js" th:src="@{/js/app-path.js}"></script><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/><link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><title>システム管理者</title><link href="/css/admin.css" rel="stylesheet" th:href="@{/css/admin.css}"/><link href="/css/v2-pages.css" rel="stylesheet" th:href="@{/css/v2-pages.css}"/></head><body class="flex flex-col" data-page="view-home"><div class="page" id="view-home">
<div class="home-header">
<div class="htitle"><i aria-hidden="true" class="fa-solid fa-user-tie"></i>システム管理者<i aria-hidden="true" class="fa-solid fa-user-tie"></i></div>
<button aria-label="ログアウト" class="logout-btn" onclick="logoutAdmin()" title="ログアウト" type="button">
<i aria-hidden="true" class="fa-solid fa-right-from-bracket"></i>
</button>
</div>
<div class="home-body">
<div class="tile-grid">
<button class="home-tile" onclick="showPage('view-menu')" type="button">
<span><i aria-hidden="true" class="fa-solid fa-utensils"></i><span id="order-tile-label">注文</span></span>
</button>
<button class="home-tile hidden" id="staff-management-tile" onclick="showPage('view-staff')" type="button">
<span><i aria-hidden="true" class="fa-solid fa-id-card"></i>担当者登録</span>
</button>
</div>
</div>
<div aria-hidden="true" class="home-footer"></div>
</div><div class="grid grid-cols-2 border-t border-gray-300 bg-white footer-nav hidden" id="footer-nav">
<button class="nav-btn" id="nav-add" onclick="showPage('view-menu')"><i class="fa-solid fa-utensils"></i><span>メニュー</span></button>
<button class="nav-btn" id="nav-cart" onclick="showPage('view-cart')">
<div class="cart-badge hidden" id="cart-badge">0</div>
<i class="fa-solid fa-basket-shopping"></i><span>注文かご</span>
</button>
</div>
<!-- 数量選択の共通ポップアップ。背景の一覧を残し、showクラスで開閉する。 -->
<div id="qty-overlay" onclick="if(event.target===this) closeQtyModal()">
<div id="qty-modal">
<div class="item-title" id="modal-item-name"></div>
<div class="item-price" id="modal-item-price"></div>
<div class="qty-row">
<button class="qty-btn" onclick="changeModalQty(-1)" style="width:3rem;height:3rem;font-size:1.5rem;">−</button>
<div class="qty-num" id="modal-qty-display">1</div>
<button class="qty-btn" onclick="changeModalQty(1)" style="width:3rem;height:3rem;font-size:1.5rem;">＋</button>
</div>
<div class="modal-btns">
<button class="btn-blue" onclick="closeQtyModal()">キャンセル</button>
<button class="btn-red" onclick="confirmAddToCart()">注文かごへ追加</button>
</div>
</div>
</div><div id="toast"></div><div id="loading-overlay">
<div class="spinner"></div>
<div style="font-size:14px;color:#666;font-weight:700;">読み込み中...</div>
</div>
<!-- API共通処理を先に読み込み、その後に画面ごとの操作を初期化する。 -->
<script src="/oracle-spring-api-client.js" th:src="@{/oracle-spring-api-client.js}"></script><script src="/js/admin.js" th:src="@{/js/admin.js}"></script></body></html>
