<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta content="/" name="app-root" th:content="@{/}"/><script src="/js/app-path.js" th:src="@{/js/app-path.js}"></script><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/><link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><title>伝票合算</title><link href="/css/admin.css" rel="stylesheet" th:href="@{/css/admin.css}"/><link href="/css/v2-pages.css" rel="stylesheet" th:href="@{/css/v2-pages.css}"/></head><body class="flex flex-col" data-page="view-merge"><div class="page" id="view-merge">
<div class="header-blue">
<div class="title-wrap">
<button class="home-btn" onclick="showPage('view-home')"><i class="fa-solid fa-house"></i></button>
<span class="title"><i class="fa-solid fa-layer-group" style="margin-right:6px;"></i>合算</span>
</div>
</div>
<div class="sub-scroll">
<div class="operation-pair">
<div class="operation-panel merge-before">
<span class="sub-label"><span class="tm-tag" style="background:#ef6c00;">合算前</span> 合算元の卓番</span>
<input class="sub-input" id="mg-table" onchange="onMergeTableInput()" onkeydown="onMergeTableKey(event)" placeholder="例: 01" type="text"/>
<div class="operation-help">合算元の卓番を入力してください。伝票は自動で確認します。</div>
</div>
<div class="operation-panel merge-after" id="mg-preview-card">
<span class="sub-label"><span class="tm-tag" style="background:#b71c1c;">合算後</span> 合算先の卓番</span>
<input class="sub-input" id="mg-target-table" onchange="onMergeTableInput()" onkeydown="onMergeTableKey(event)" placeholder="例: 02 / 02-1" style="margin-bottom:10px;" type="text"/>
<div id="mg-preview"></div>
</div>
</div>
<div id="mg-tickets-wrap"></div>
<div class="mt-2 hidden" id="mg-btn-wrap">
<button class="btn-red w-full" onclick="executeMerge()"><i class="fa-solid fa-layer-group"></i> 入力した卓番の伝票を合算する</button>
</div>
</div>
</div><div class="grid grid-cols-2 border-t border-gray-300 bg-white footer-nav hidden" id="footer-nav">
<button class="nav-btn" id="nav-add" onclick="showPage('view-menu')"><i class="fa-solid fa-utensils"></i><span>メニュー</span></button>
<button class="nav-btn" id="nav-cart" onclick="showPage('view-cart')">
<div class="cart-badge hidden" id="cart-badge">0</div>
<i class="fa-solid fa-basket-shopping"></i><span>注文かご</span>
</button>
</div><div id="qty-overlay" onclick="if(event.target===this) closeQtyModal()">
<div id="qty-modal">
<div class="item-title" id="modal-item-name"></div>
<div class="item-price" id="modal-item-price"></div>
<div class="qty-row">
<button class="qty-btn" onclick="changeModalQty(-1)" style="width:3rem;height:3rem;font-size:1.5rem;">−</button>
<div class="qty-num" id="modal-qty-display">1</div>
<button class="qty-btn" onclick="changeModalQty(1)" style="width:3rem;height:3rem;font-size:1.5rem;">＋</button>
</div>
<div class="modal-btns">
<button class="btn-blue" onclick="closeQtyModal()">キャンセル</button>
<button class="btn-red" onclick="confirmAddToCart()">注文かごへ追加</button>
</div>
</div>
</div><div id="toast"></div><div id="loading-overlay">
<div class="spinner"></div>
<div style="font-size:14px;color:#666;font-weight:700;">読み込み中...</div>
</div><script src="/oracle-spring-api-client.js" th:src="@{/oracle-spring-api-client.js}"></script><script src="/js/admin.js" th:src="@{/js/admin.js}"></script></body></html>
