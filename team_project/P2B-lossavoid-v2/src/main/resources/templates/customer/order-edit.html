<!DOCTYPE html>
<!-- 注文の変更前・変更後の卓番を確認する画面。実行時に注文の来店情報の紐づけを更新する。 -->


<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta content="/" name="app-root" th:content="@{/}"/><script src="/js/app-path.js" th:src="@{/js/app-path.js}"></script><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/><link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><title>卓番変更</title><link href="/css/admin.css" rel="stylesheet" th:href="@{/css/admin.css}"/><link href="/css/v2-pages.css" rel="stylesheet" th:href="@{/css/v2-pages.css}"/></head><body class="flex flex-col" data-page="view-tablemove"><div class="page" id="view-tablemove">
<div class="header-blue">
<div class="title-wrap">
<button class="home-btn" onclick="showPage('view-home')"><i class="fa-solid fa-house"></i></button>
<span class="title"><i class="fa-solid fa-right-left" style="margin-right:6px;"></i>テーブル変更</span>
</div>
</div>
<div class="sub-scroll">
<div class="operation-pair">
<div class="operation-panel before">
<span class="sub-label"><span class="tm-tag tm-tag-from">変更前</span> 現在の卓番</span>
<input class="sub-input" id="tm-from-table" onchange="onTableMoveTableInput()" onkeydown="onTableMoveTableKey(event)" placeholder="例: 01 / 01-1" type="text"/>
<div class="operation-help">移動元の卓番を入力すると、変更対象の伝票を自動で確認します。</div>
</div>
<div class="operation-panel after" id="tm-move-card">
<span class="sub-label"><span class="tm-tag tm-tag-to">変更後</span> 移動先の卓番</span>
<div class="flex gap-2">
<input class="sub-input" id="tm-to-table" onchange="onTableMoveTargetInput()" onkeydown="onTableMoveTargetKey(event)" placeholder="例: 02 / 02-1" type="text"/>
<button class="btn-red" onclick="executeTableMove()" style="flex-shrink:0;"><i class="fa-solid fa-check"></i> 移動実行</button>
</div>
<div class="tm-preview" id="tm-preview"></div>
</div>
</div>
<div id="tm-tickets-wrap"></div>
</div>
</div><div class="grid grid-cols-2 border-t border-gray-300 bg-white footer-nav hidden" id="footer-nav">
<button class="nav-btn" id="nav-add" onclick="showPage('view-menu')"><i class="fa-solid fa-utensils"></i><span>メニュー</span></button>
<button class="nav-btn" id="nav-cart" onclick="showPage('view-cart')">
<div class="cart-badge hidden" id="cart-badge">0</div>
<i class="fa-solid fa-basket-shopping"></i><span>注文かご</span>
</button>
</div>
<!-- 数量選択の共通ポップアップ。背景の一覧を残し、showクラスで開閉する。 -->
<div id="qty-overlay" onclick="if(event.target===this) closeQtyModal()">
<div id="qty-modal">
<div class="item-title" id="modal-item-name"></div>
<div class="item-price" id="modal-item-price"></div>
<div class="qty-row">
<button class="qty-btn" onclick="changeModalQty(-1)" style="width:3rem;height:3rem;font-size:1.5rem;">−</button>
<div class="qty-num" id="modal-qty-display">1</div>
<button class="qty-btn" onclick="changeModalQty(1)" style="width:3rem;height:3rem;font-size:1.5rem;">＋</button>
</div>
<div class="modal-btns">
<button class="btn-blue" onclick="closeQtyModal()">キャンセル</button>
<button class="btn-red" onclick="confirmAddToCart()">注文かごへ追加</button>
</div>
</div>
</div><div id="toast"></div><div id="loading-overlay">
<div class="spinner"></div>
<div style="font-size:14px;color:#666;font-weight:700;">読み込み中...</div>
</div>
<!-- API共通処理を先に読み込み、その後に画面ごとの操作を初期化する。 -->
<script src="/oracle-spring-api-client.js" th:src="@{/oracle-spring-api-client.js}"></script><script src="/js/admin.js" th:src="@{/js/admin.js}"></script></body></html>
