<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/><link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><title>在庫管理</title><link href="/css/admin.css" rel="stylesheet"/><link href="/css/v2-pages.css" rel="stylesheet"/></head><body class="flex flex-col" data-page="view-stock"><div class="page" id="view-stock">
<div class="header-blue">
<div class="title-wrap">
<button class="home-btn" onclick="showPage('view-home')"><i class="fa-solid fa-house"></i></button>
<span class="title"><i class="fa-solid fa-boxes-stacked" style="margin-right:6px;"></i>在庫管理</span>
</div>
</div>
<div id="search-wrap">
<input id="stock-search-input" oninput="renderStockList()" placeholder="メニュー名・番号で検索" type="text"/>
</div>
<div class="sub-scroll">
<div class="sub-card" style="padding:10px 14px;">
<div style="font-size:11.5px;color:#666;line-height:1.6;">
<i class="fa-solid fa-circle-info" style="color:#1565c0;"></i>
                「品切れ」をONにするか、残数を0にすると自動的に品切れ表示になります。残数を空欄にすると数量管理なし（常時注文可）になります。
            </div>
</div>
<div class="sub-card" id="stock-list-card"></div>
<div class="mt-2">
<button class="btn-blue w-full" onclick="saveAllStock()"><i class="fa-solid fa-floppy-disk"></i> まとめて保存</button>
</div>
</div>
</div><div class="grid grid-cols-2 border-t border-gray-300 bg-white footer-nav hidden" id="footer-nav">
<button class="nav-btn" id="nav-add" onclick="showPage('view-menu')"><i class="fa-solid fa-utensils"></i><span>メニュー</span></button>
<button class="nav-btn" id="nav-cart" onclick="showPage('view-cart')">
<div class="cart-badge hidden" id="cart-badge">0</div>
<i class="fa-solid fa-basket-shopping"></i><span>注文かご</span>
</button>
</div><div id="qty-overlay" onclick="if(event.target===this) closeQtyModal()">
<div id="qty-modal">
<div class="item-title" id="modal-item-name"></div>
<div class="item-price" id="modal-item-price"></div>
<div class="qty-row">
<button class="qty-btn" onclick="changeModalQty(-1)" style="width:3rem;height:3rem;font-size:1.5rem;">−</button>
<div class="qty-num" id="modal-qty-display">1</div>
<button class="qty-btn" onclick="changeModalQty(1)" style="width:3rem;height:3rem;font-size:1.5rem;">＋</button>
</div>
<div class="modal-btns">
<button class="btn-blue" onclick="closeQtyModal()">キャンセル</button>
<button class="btn-red" onclick="confirmAddToCart()">注文かごへ追加</button>
</div>
</div>
</div><div id="toast"></div><div id="loading-overlay">
<div class="spinner"></div>
<div style="font-size:14px;color:#666;font-weight:700;">読み込み中...</div>
</div><script src="/oracle-spring-api-client.js"></script><script src="/js/admin.js"></script></body></html>
