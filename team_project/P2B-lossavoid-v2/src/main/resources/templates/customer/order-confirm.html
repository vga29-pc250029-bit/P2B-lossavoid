<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta content="/" name="app-root" th:content="@{/}" />
	<script src="/js/app-path.js" th:src="@{/js/app-path.js}"></script>
	<meta charset="utf-8" />
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
	<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
	<script src="https://cdn.tailwindcss.com"></script>
	<title>注文内容確認</title>
	<link href="/css/admin.css" rel="stylesheet" th:href="@{/css/admin.css}" />
	<link href="/css/v2-pages.css" rel="stylesheet" th:href="@{/css/v2-pages.css}" />
</head>

<body class="flex flex-col" data-page="view-cart">
	<div class="page" id="view-cart">
		<div class="header-blue">
			<div class="title-wrap">
				<button class="home-btn" onclick="showPage('view-home')"><i class="fa-solid fa-house"></i></button>
				<span class="title"><i class="fa-solid fa-basket-shopping" style="margin-right:6px;"></i>注文内容確認</span>
			</div>
			<span class="table-chip" id="table-chip2">テーブル —</span>
		</div>
		<div id="staff-setup-bar">
			<div class="setup-field">
				<label for="table-number-input"><i class="fa-solid fa-chair"></i> 卓番</label>
				<input id="table-number-input" onblur="normalizeStaffTableNumber()" oninput="onStaffInfoChange()"
					placeholder="例: 01 / 01-1" type="text" />
			</div>
			<div class="setup-field">
				<label for="guest-count-input"><i class="fa-solid fa-users"></i> 人数</label>
				<input id="guest-count-input" inputmode="numeric" max="99" min="1" onblur="normalizeGuestCount()"
					oninput="onStaffInfoChange()" placeholder="例: 2" type="number" />
			</div>
		</div>
		<div class="p-3 bg-blue-50 border-b border-blue-100 text-sm font-bold text-blue-900" id="cart-staff-info">
			卓番: — / 人数: —名
		</div>
		<div class="flex-1 overflow-y-auto p-3" id="cart-scroll">
			<div class="cart-section-title">
				<span><i class="fa-solid fa-cart-plus"></i> これから注文する商品</span>
				<span class="count" id="cart-current-count">0点</span>
			</div>
			<div id="cart-items-list"></div>
			<div class="cart-section-title" style="margin-top:18px;">
				<span><i class="fa-solid fa-clipboard-check"></i> 注文済み商品</span>
				<span class="count" id="ordered-count">確認中</span>
			</div>
			<div id="ordered-items-list"></div>
		</div>
		<div class="p-3 border-t border-gray-200 bg-white">
			<div class="flex justify-between text-lg font-bold mb-3">
				<span id="total-count">0点</span>
				<span id="total-price">合計 0円 (税込)</span>
			</div>
			<div class="flex justify-center space-x-3">
				<button class="btn-blue flex-1" onclick="showPage('view-menu')"><i class="fa-solid fa-plus"></i>
					追加で選ぶ</button>
				<button class="btn-red flex-1" id="submit-btn" onclick="submitOrder()"><i
						class="fa-solid fa-paper-plane"></i> 注文する</button>
			</div>
		</div>
	</div>
	<div class="grid grid-cols-2 border-t border-gray-300 bg-white footer-nav hidden" id="footer-nav">
		<button class="nav-btn" id="nav-add" onclick="showPage('view-menu')"><i
				class="fa-solid fa-utensils"></i><span>メニュー</span></button>
		<button class="nav-btn" id="nav-cart" onclick="showPage('view-cart')">
			<div class="cart-badge hidden" id="cart-badge">0</div>
			<i class="fa-solid fa-basket-shopping"></i><span>注文かご</span>
		</button>
	</div>
	<div id="qty-overlay" onclick="if(event.target===this) closeQtyModal()">
		<div id="qty-modal">
			<div class="item-title" id="modal-item-name"></div>
			<div class="item-price" id="modal-item-price"></div>
			<div class="qty-row">
				<button class="qty-btn" onclick="changeModalQty(-1)"
					style="width:3rem;height:3rem;font-size:1.5rem;">−</button>
				<div class="qty-num" id="modal-qty-display">1</div>
				<button class="qty-btn" onclick="changeModalQty(1)"
					style="width:3rem;height:3rem;font-size:1.5rem;">＋</button>
			</div>
			<div class="modal-btns">
				<button class="btn-blue" onclick="closeQtyModal()">キャンセル</button>
				<button class="btn-red" onclick="confirmAddToCart()">注文かごへ追加</button>
			</div>
		</div>
	</div>
	<div id="toast"></div>
	<div id="loading-overlay">
		<div class="spinner"></div>
		<div style="font-size:14px;color:#666;font-weight:700;">読み込み中...</div>
	</div>
	<script src="/oracle-spring-api-client.js" th:src="@{/oracle-spring-api-client.js}"></script>
	<script src="/js/admin.js" th:src="@{/js/admin.js}"></script>
</body>

</html>
