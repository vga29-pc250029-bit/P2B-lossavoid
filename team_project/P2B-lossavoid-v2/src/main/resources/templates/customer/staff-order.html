<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/><link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><title>従業員注文</title><link href="/css/admin.css" rel="stylesheet"/><link href="/css/v2-pages.css" rel="stylesheet"/></head><body class="flex flex-col" data-page="view-menu"><div class="page" id="view-menu">
<div class="header-blue">
<div class="title-wrap">
<button class="home-btn" onclick="showPage('view-home')"><i class="fa-solid fa-house"></i></button>
<span class="title"><i class="fa-solid fa-utensils" style="margin-right:6px;"></i><span id="order-page-title">注文</span></span>
</div>
<span class="table-chip" id="table-chip">テーブル —</span>
</div><nav aria-label="店舗操作" class="v2-links"><a href="/admin">ホーム</a><a href="/admin/orders/new">注文</a><a href="/admin/orders">注文済み</a><a href="/admin/orders/edit">卓番変更</a><a href="/admin/orders/merge">合算</a><a href="/admin/stock">在庫</a><a href="/admin/allergens">アレルギー</a></nav>
<!-- 卓番・人数 入力バー（常時変更可能） -->
<div id="staff-setup-bar">
<div class="setup-field">
<label for="table-number-input"><i class="fa-solid fa-chair"></i> 卓番</label>
<input id="table-number-input" onblur="normalizeStaffTableNumber()" oninput="onStaffInfoChange()" placeholder="例: 01 / 01-1" type="text"/>
</div>
<div class="setup-field">
<label for="guest-count-input"><i class="fa-solid fa-users"></i> 人数</label>
<input id="guest-count-input" inputmode="numeric" max="99" min="1" onblur="normalizeGuestCount()" oninput="onStaffInfoChange()" placeholder="例: 2" type="number"/>
</div>
</div>
<div id="search-wrap">
<input id="search-input" oninput="onSearchInput()" placeholder="メニュー名で検索" type="text"/>
</div>
<div id="category-tabs"></div>
<div id="menu-scroll">
<div class="menu-grid" id="menu-grid"></div>
</div>
</div><div class="grid grid-cols-2 border-t border-gray-300 bg-white footer-nav hidden" id="footer-nav">
<button class="nav-btn" id="nav-add" onclick="showPage('view-menu')"><i class="fa-solid fa-utensils"></i><span>メニュー</span></button>
<button class="nav-btn" id="nav-cart" onclick="showPage('view-cart')">
<div class="cart-badge hidden" id="cart-badge">0</div>
<i class="fa-solid fa-basket-shopping"></i><span>注文かご</span>
</button>
</div><div id="qty-overlay" onclick="if(event.target===this) closeQtyModal()">
<div id="qty-modal">
<div class="item-title" id="modal-item-name"></div>
<div class="item-price" id="modal-item-price"></div>
<div class="qty-row">
<button class="qty-btn" onclick="changeModalQty(-1)" style="width:3rem;height:3rem;font-size:1.5rem;">−</button>
<div class="qty-num" id="modal-qty-display">1</div>
<button class="qty-btn" onclick="changeModalQty(1)" style="width:3rem;height:3rem;font-size:1.5rem;">＋</button>
</div>
<div class="modal-btns">
<button class="btn-blue" onclick="closeQtyModal()">キャンセル</button>
<button class="btn-red" onclick="confirmAddToCart()">注文かごへ追加</button>
</div>
</div>
</div><div id="toast"></div><div id="loading-overlay">
<div class="spinner"></div>
<div style="font-size:14px;color:#666;font-weight:700;">読み込み中...</div>
</div><script src="/oracle-spring-api-client.js"></script><script src="/js/admin.js"></script></body></html>
