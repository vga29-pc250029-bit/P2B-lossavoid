<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/><link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><title>担当者変更</title><link href="/css/admin.css" rel="stylesheet"/><link href="/css/v2-pages.css" rel="stylesheet"/></head><body class="flex flex-col" data-page="view-staff" data-staff-mode="update"><div class="page" id="view-staff">
<div class="header-blue">
<div class="title-wrap">
<button class="home-btn" onclick="showPage('view-home')"><i class="fa-solid fa-house"></i></button>
<span class="title"><i class="fa-solid fa-id-card" style="margin-right:6px;"></i>担当者変更</span>
</div>
</div>
<div class="sub-scroll"><div class="v2-links"><a href="/admin/staff">担当者一覧</a><a href="/admin/staff/register">担当者登録</a></div>
<div class="sub-card">
<div class="staff-section-head">
<span class="sub-label" id="staff-form-title">担当者を登録</span>
</div>
<form id="staff-form" novalidate="" onsubmit="saveStaff(event)">
<div class="staff-form-grid">
<label>
<span class="sub-label">従業員コード</span>
<input autocomplete="off" class="sub-input" id="staff-reg-code" maxlength="20" placeholder="例: T001" required="" type="text"/>
</label>
<label>
<span class="sub-label">氏名</span>
<input autocomplete="off" class="sub-input" id="staff-reg-name" maxlength="80" placeholder="例: 山田 太郎" required="" type="text"/>
</label>
<label>
<span class="sub-label">パスワード</span>
<input autocomplete="new-password" class="sub-input" id="staff-reg-password" maxlength="100" placeholder="4文字以上" type="password"/>
<small id="staff-password-help" style="color:#64748b;">新規登録時は必須です</small>
</label>
<label>
<span class="sub-label">権限</span>
<select class="sub-input" id="staff-reg-role" required="">
<option value="EMPLOYEE">従業員</option>
<option value="SYSTEM_ADMIN">システム管理者</option>
</select>
</label>
<label class="staff-status-toggle">
<span><b>有効なアカウント</b><br/><small style="color:#64748b;">無効にするとログインできません</small></span>
<input checked="" id="staff-reg-enabled" type="checkbox"/>
</label>
</div>
<div class="staff-form-actions">
<button class="btn-blue hidden" id="staff-cancel-edit" onclick="resetStaffForm()" type="button">編集をやめる</button>
<button class="btn-blue single" id="staff-save-btn" type="submit"><i class="fa-solid fa-user-plus"></i> 登録する</button>
</div>
</form>
</div>
<div class="sub-card">
<div class="staff-section-head">
<span class="sub-label">登録済みメンバー</span>
<span class="staff-count" id="staff-list-count">0名</span>
</div>
<div id="staff-list-card"></div>
</div>
</div>
</div><div class="grid grid-cols-2 border-t border-gray-300 bg-white footer-nav hidden" id="footer-nav">
<button class="nav-btn" id="nav-add" onclick="showPage('view-menu')"><i class="fa-solid fa-utensils"></i><span>メニュー</span></button>
<button class="nav-btn" id="nav-cart" onclick="showPage('view-cart')">
<div class="cart-badge hidden" id="cart-badge">0</div>
<i class="fa-solid fa-basket-shopping"></i><span>注文かご</span>
</button>
</div><div id="qty-overlay" onclick="if(event.target===this) closeQtyModal()">
<div id="qty-modal">
<div class="item-title" id="modal-item-name"></div>
<div class="item-price" id="modal-item-price"></div>
<div class="qty-row">
<button class="qty-btn" onclick="changeModalQty(-1)" style="width:3rem;height:3rem;font-size:1.5rem;">−</button>
<div class="qty-num" id="modal-qty-display">1</div>
<button class="qty-btn" onclick="changeModalQty(1)" style="width:3rem;height:3rem;font-size:1.5rem;">＋</button>
</div>
<div class="modal-btns">
<button class="btn-blue" onclick="closeQtyModal()">キャンセル</button>
<button class="btn-red" onclick="confirmAddToCart()">注文かごへ追加</button>
</div>
</div>
</div><div id="toast"></div><div id="loading-overlay">
<div class="spinner"></div>
<div style="font-size:14px;color:#666;font-weight:700;">読み込み中...</div>
</div><script src="/oracle-spring-api-client.js"></script><script src="/js/admin.js"></script></body></html>
