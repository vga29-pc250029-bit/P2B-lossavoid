<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ログアウト</title>
<style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #1a5f7a;
            color: #0d3c4f;
            font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }
        main {
            width: min(100%, 420px);
            padding: 32px 24px;
            border-radius: 8px;
            background: #e5f5fc;
            text-align: center;
        }
        h1 { margin: 0 0 12px; font-size: 24px; }
        p { margin: 0 0 24px; color: #31596a; }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 24px;
            border-radius: 8px;
            background: #1565c0;
            color: #fff;
            font-weight: 800;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            font: inherit;
        }
    </style>
</head>
<body>
<main>
<h1>ログアウトしました</h1>
<p>管理画面を終了しました。</p>
<button id="login-button" type="button">ログイン画面へ</button>
</main>
<script>
        const loginButton = document.getElementById('login-button');
        loginButton.addEventListener('click', async () => {
            loginButton.disabled = true;
            loginButton.textContent = '認証画面を準備中...';
            try {
                await fetch('/api/auth/logout', { method: 'POST', cache: 'no-store' });
            } finally {
                const cleanOrigin = `${location.protocol}//${location.host}`;
                window.location.assign(`${cleanOrigin}/staff/login?login=${Date.now()}`);
                setTimeout(() => {
                    loginButton.disabled = false;
                    loginButton.textContent = 'ログイン画面へ';
                }, 1200);
            }
        });
    </script>
</body>
</html>
