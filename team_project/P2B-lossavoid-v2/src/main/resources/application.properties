# アプリ名・公開パス・Oracle接続先・認証などの設定。環境変数で既定値を上書きできる項目は、各PCの環境に合わせて指定する。
spring.application.name=P2B-lossavoid-v2
# Webの待受ポートと公開パス。画面側のapp-rootと共通URL関数はこの配置に追従する。
server.port=${SERVER_PORT:1122}
server.servlet.context-path=/lossavoid
# 各PCのOracle接続設定。環境変数を優先し、接続先サービスとユーザーを揃える。
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_USERNAME:lossavoid}
spring.datasource.password=${ORACLE_PASSWORD:systemsss}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# schema.sqlを起動のたびに自動実行しない。追加SQLの実行はLossavoidSchemaInitializerが別途担当する。
spring.sql.init.mode=never
spring.jackson.deserialization.accept-float-as-int=false
spring.thymeleaf.cache=false
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
# 初期管理者の設定。実運用の認証情報は既定値に依存せず環境変数で渡す。
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:sanko3535}
app.store-id=${STORE_ID:1}
