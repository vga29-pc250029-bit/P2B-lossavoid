# アプリ名・公開パス・Oracle接続先などの設定。環境変数で既定値を上書きできる項目は、各PCの環境に合わせて指定する。
spring.application.name=P2B-lossavoid-v2
# Webの待受ポートと公開パス。画面側のapp-rootと共通URL関数はこの配置に追従する。
server.port=${SERVER_PORT:1122}
server.servlet.context-path=/lossavoid
# 各PCのOracle接続設定。環境変数を優先し、接続先サービスとユーザーを揃える。
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_USERNAME:lossavoid}
spring.datasource.password=${ORACLE_PASSWORD:systemsss}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# schema.sqlを起動のたびに自動実行しない。追加SQLの実行はLossavoidSchemaInitializerが別途担当する。
spring.sql.init.mode=never
spring.jackson.deserialization.accept-float-as-int=false
spring.thymeleaf.cache=false
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
# ログインを行わない店舗内LAN向けの構成。公開範囲はネットワーク側で制限する。
app.store-id=${STORE_ID:1}
app.kitchen.ordering-mode=${KDS_ORDERING_MODE:optimized}
app.kitchen.comparison-mode=${KDS_COMPARISON_MODE:false}
app.kitchen.comparison-tag=${KDS_COMPARISON_TAG:}
# 焼成チキンは客注文とは別の仕込み依頼。焼成9分を見越して補充し、完成から60分で在庫から外す。
app.chicken.auto.enabled=${CHICKEN_AUTO_ENABLED:true}
app.chicken.schedule.enabled=${CHICKEN_SCHEDULE_ENABLED:true}
app.chicken.check-interval-ms=${CHICKEN_CHECK_INTERVAL_MS:5000}
app.chicken.initial-delay-ms=${CHICKEN_INITIAL_DELAY_MS:1000}
app.chicken.opening=${CHICKEN_OPENING:11:00}
app.chicken.closing=${CHICKEN_CLOSING:23:00}
app.chicken.lunch-start=${CHICKEN_LUNCH_START:11:30}
app.chicken.lunch-end=${CHICKEN_LUNCH_END:14:00}
app.chicken.dinner-start=${CHICKEN_DINNER_START:17:30}
app.chicken.dinner-end=${CHICKEN_DINNER_END:20:30}
app.chicken.peak-target=${CHICKEN_PEAK_TARGET:6}
app.chicken.quiet-target=${CHICKEN_QUIET_TARGET:2}
app.chicken.bake-minutes=${CHICKEN_BAKE_MINUTES:9}
app.chicken.shelf-life-minutes=${CHICKEN_SHELF_LIFE_MINUTES:60}
app.chicken.max-batch-qty=${CHICKEN_MAX_BATCH_QTY:12}
